core:
  delay: 10 # seconds between each give
  same: false # same block for all players
  case-duration: 3 # time to get the reward of a case
  blacklisted-blocks: [
    "AIR",
    "CAVE_AIR",
    "VOID_AIR",
    "BEDROCK",
    "SPAWNER",
    "BARRIER",
    "NETHER_PORTAL",
    "COMMAND_BLOCK",
    "CHAIN_COMMAND_BLOCK",
    "REPEATING_COMMAND_BLOCK",
    "COMMAND_BLOCK_MINECART",
    "STRUCTURE_VOID",
    "DEBUG_STICK"
  ]
